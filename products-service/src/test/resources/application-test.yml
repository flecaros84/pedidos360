spring:
  datasource:
    url: jdbc:h2:mem:catalogotest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  security:
    mode: local
  catalog:
    seed-demo: true

# Embedded tests do not require the external RabbitMQ broker.
management:
  health:
    rabbit:
      enabled: false
