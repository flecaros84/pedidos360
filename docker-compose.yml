services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360
    ports:
      - "5432:5432"
    volumes:
      - pedidos360-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos360 -d pedidos360"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    container_name: pedidos360-auth
    environment:
      APP_SECURITY_MODE: azure
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost

      AZURE_TENANT_ID: e5372bf0-c5e3-4286-887c-79069f209c1f
      AZURE_CLIENT_ID: a561d8ef-b187-4bf0-9555-8f66b445df2e
      AZURE_ISSUER_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: a561d8ef-b187-4bf0-9555-8f66b445df2e
    ports:
      - "8081:8081"

  cart-service:
    build:
      context: ./cart-service
    container_name: pedidos360-cart
    environment:
      APP_SECURITY_MODE: azure
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost

      AZURE_TENANT_ID: e5372bf0-c5e3-4286-887c-79069f209c1f
      AZURE_CLIENT_ID: a561d8ef-b187-4bf0-9555-8f66b445df2e
      AZURE_ISSUER_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: a561d8ef-b187-4bf0-9555-8f66b445df2e

      DATABASE_URL: jdbc:postgresql://postgres:5432/pedidos360
      DATABASE_USERNAME: pedidos360
      DATABASE_PASSWORD: pedidos360
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy  

  frontend:
    build:
      context: ./frontend
    container_name: pedidos360-frontend
    environment:
      AUTH_MODE: azure
      AUTH_API_URL: http://localhost:8081
      CART_API_URL: http://localhost:8082
      AZURE_TENANT_ID: "e5372bf0-c5e3-4286-887c-79069f209c1f"
      AZURE_CLIENT_ID: "a561d8ef-b187-4bf0-9555-8f66b445df2e"
      AZURE_API_SCOPE: "api://a561d8ef-b187-4bf0-9555-8f66b445df2e/pedidos360.access"
      AZURE_REDIRECT_URI: "http://localhost"
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - cart-service

volumes:
  pedidos360-postgres-data:
