name: Deploy Notifications EC2
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag GHCR (latest o SHA)'
        required: true
        default: 'latest'
permissions:
  contents: read
  packages: read
concurrency:
  group: deploy-notifications-ec2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          aws-secret-access-key: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          aws-session-token: '${{ secrets.AWS_SESSION_TOKEN }}'
          aws-region: us-east-1
      - name: Instalar Session Manager Plugin
        run: |
          set -euo pipefail
          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
      - name: Preparar túnel SSH por SSM
        env:
          SSH_KEY: '${{ secrets.EC2_SSH_PRIVATE_KEY }}'
          INSTANCE_ID: '${{ secrets.NOTIFICATIONS_EC2_INSTANCE_ID }}'
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || exit 1
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pedidos360.pem
          chmod 600 ~/.ssh/pedidos360.pem
          cat > ~/.ssh/config <<EOF
          Host target-ec2
            HostName $INSTANCE_ID
            User ec2-user
            IdentityFile ~/.ssh/pedidos360.pem
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ProxyCommand sh -c 'aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p'
          EOF
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=30 target-ec2 'sudo docker info >/dev/null'
      - name: Crear variables de ejecución de Notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_PRIVATE_IP }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          data={
              'DATABASE_URL': os.environ['DATABASE_URL'],
              'DATABASE_USERNAME': os.environ['DATABASE_USERNAME'],
              'DATABASE_PASSWORD': os.environ['DATABASE_PASSWORD'],
              'RABBITMQ_USERNAME': os.environ['RABBITMQ_USERNAME'],
              'RABBITMQ_PASSWORD': os.environ['RABBITMQ_PASSWORD'],
              'SMTP_HOST': os.environ['SMTP_HOST'],
              'SMTP_PORT': os.environ['SMTP_PORT'],
              'SMTP_USERNAME': os.environ['SMTP_USERNAME'],
              'SMTP_PASSWORD': os.environ['SMTP_PASSWORD'],
              'SMTP_FROM': os.environ['SMTP_FROM'],
              'RABBITMQ_HOST': os.environ['RABBITMQ_HOST'],

              'DATABASE_DDL_AUTO': 'update',
              'SERVER_PORT': '8085',
              'SMTP_AUTH': 'true',
              'SMTP_STARTTLS': 'true',
          }
          for key,value in data.items():
              if not value or '\n' in value or '\r' in value:
                  raise SystemExit('Valor ausente o inválido: '+key)
          Path('notifications.env').write_text(''.join(f'{k}={v}\n' for k,v in data.items()),encoding='utf-8')
          PY
          chmod 600 notifications.env
      - name: Copiar configuración privada
        run: |
          set -euo pipefail
          scp notifications.env target-ec2:~/notifications.env
          ssh target-ec2 'chmod 600 ~/notifications.env'
      - name: Desplegar solamente Notifications
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          IMAGE_TAG: '${{ inputs.image_tag }}'
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || exit 1
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/$OWNER/pedidos360-notifications:$IMAGE_TAG"
          printf '%s' "$GH_TOKEN" | ssh target-ec2 "sudo docker login ghcr.io -u '$OWNER' --password-stdin"
          ssh target-ec2 bash -s -- "$IMAGE" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"
          sudo docker pull "$IMAGE"
          sudo docker logout ghcr.io >/dev/null
          sudo docker rm -f pedidos360-notifications 2>/dev/null || true
          sudo docker run -d --name pedidos360-notifications --restart unless-stopped \
            --env-file /home/ec2-user/notifications.env -p 127.0.0.1:8085:8085 "$IMAGE"
          for i in $(seq 1 36); do
            if curl -fsS --max-time 3 http://127.0.0.1:8085/actuator/health | grep -q '"status":"UP"'; then
              echo 'Notifications UP'
              exit 0
            fi
            sleep 5
          done
          sudo docker logs --tail 100 pedidos360-notifications
          exit 1
          REMOTE
      - name: Limpiar configuración del runner
        if: always()
        run: rm -f notifications.env ~/.ssh/pedidos360.pem ~/.ssh/config
