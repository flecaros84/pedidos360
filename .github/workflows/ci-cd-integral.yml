name: Pedidos360 v1 - Integración completa

on:
  push:
    branches: [feature/integracion-final]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, cart, products, orders, notifications, payment, audit, analytics, dispatch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}-service/pom.xml
      - name: Compilar y probar ${{ matrix.service }}
        working-directory: ${{ matrix.service }}-service
        run: mvn -B -ntp clean verify

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  terraform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Terraform fmt y validate
        working-directory: terraform/lab
        run: |
          terraform fmt -recursive
          terraform init -backend=false
          terraform validate

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate integrated Docker Compose
        run: docker compose -f docker-compose.full.yml config --quiet

  images:
    needs: [backend-tests, frontend-tests, terraform-validation, docker-validation]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, cart, products, orders, notifications, payment, audit, analytics, dispatch, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service == 'frontend' && 'frontend' || format('{0}-service', matrix.service) }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedidos360-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pedidos360-${{ matrix.service }}:integration

