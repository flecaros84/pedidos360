name: Deploy Auth EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de la imagen"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          AUTH_HOST: ${{ secrets.AUTH_EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pedidos360.pem
          chmod 600 ~/.ssh/pedidos360.pem
          ssh-keyscan -H "$AUTH_HOST" >> ~/.ssh/known_hosts

      - name: Crear configuración
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_ISSUER_URI: ${{ secrets.AZURE_ISSUER_URI }}
          AZURE_AUDIENCE: ${{ secrets.AZURE_AUDIENCE }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          cat > auth.env <<EOF
          APP_SECURITY_MODE=azure
          AZURE_TENANT_ID=$AZURE_TENANT_ID
          AZURE_CLIENT_ID=$AZURE_CLIENT_ID
          AZURE_ISSUER_URI=$AZURE_ISSUER_URI
          AZURE_AUDIENCE=$AZURE_AUDIENCE
          APP_CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,$FRONTEND_ORIGIN
          EOF

      - name: Copiar configuración
        env:
          AUTH_HOST: ${{ secrets.AUTH_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/pedidos360.pem auth.env "$EC2_USER@$AUTH_HOST:~/auth.env"

      - name: Desplegar Auth Service
        env:
          AUTH_HOST: ${{ secrets.AUTH_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/pedidos360.pem "$EC2_USER@$AUTH_HOST" \
            "docker login ghcr.io -u '$OWNER' --password-stdin"

          ssh -i ~/.ssh/pedidos360.pem "$EC2_USER@$AUTH_HOST" "
            docker pull ghcr.io/$OWNER/pedidos360-auth:$IMAGE_TAG

            docker rm -f pedidos360-auth 2>/dev/null || true

            docker run -d \
              --name pedidos360-auth \
              --restart unless-stopped \
              --env-file ~/auth.env \
              -p 8081:8081 \
              ghcr.io/$OWNER/pedidos360-auth:$IMAGE_TAG
          "