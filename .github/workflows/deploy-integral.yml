name: Pedidos360 v1 - Deploy EC2 vía SSM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable git commit SHA of published images'
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-lab
    steps:
      - uses: actions/checkout@v4
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]] || { echo 'Use a 40-character git SHA'; exit 1; }
      - name: Configure temporary AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Deploy images to shared EC2 hosts via SSM
        shell: pwsh
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: ./scripts/lab/lab-deploy.ps1 -ImageTag $env:IMAGE_TAG
