server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: cart-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DATABASE_USERNAME:pedidos360}
    password: ${DATABASE_PASSWORD:pedidos360}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    mode: ${APP_SECURITY_MODE:local}
    azure:
      tenant-id: ${AZURE_TENANT_ID:}
      client-id: ${AZURE_CLIENT_ID:}
      issuer-uri: ${AZURE_ISSUER_URI:}
      audience: ${AZURE_AUDIENCE:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
