server:
  port: ${SERVER_PORT:8082}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  application:
    name: cart-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DATABASE_USERNAME:pedidos360}
    password: ${DATABASE_PASSWORD:pedidos360}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_IDLE:0}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  products:
    base-url: ${PRODUCTS_INTERNAL_URL:http://localhost:8083}
  security:
    mode: ${APP_SECURITY_MODE:azure}
    azure:
      tenant-id: ${AZURE_TENANT_ID:}
      client-id: ${AZURE_CLIENT_ID:}
      issuer-uri: ${AZURE_ISSUER_URI:}
      audience: ${AZURE_AUDIENCE:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
