server:
  port: ${SERVER_PORT:8088}
spring:
  application:
    name: analytics-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DATABASE_USERNAME:pedidos360}
    password: ${DATABASE_PASSWORD:pedidos360}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: analytics
    schemas: analytics
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    mode: ${APP_SECURITY_MODE:azure}
    azure:
      issuer-uri: ${AZURE_ISSUER_URI:}
      audience: ${AZURE_AUDIENCE:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
analytics:
  dynamodb-table: ${DYNAMODB_TABLE:pedidos360-events}
  dynamodb-endpoint: ${DYNAMODB_ENDPOINT:}
  aws-region: ${AWS_REGION:us-east-1}
  ws-tickets-table: ${WS_TICKETS_TABLE:pedidos360-ws-tickets}
  ws-connections-table: ${WS_CONNECTIONS_TABLE:pedidos360-ws-connections}
  ws-management-endpoint: ${WS_MANAGEMENT_ENDPOINT:}
