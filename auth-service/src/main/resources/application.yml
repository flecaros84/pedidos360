server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    mode: ${APP_SECURITY_MODE:local}
    azure:
      tenant-id: ${AZURE_TENANT_ID:}
      client-id: ${AZURE_CLIENT_ID:}
      issuer-uri: ${AZURE_ISSUER_URI:}
      audience: ${AZURE_AUDIENCE:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
