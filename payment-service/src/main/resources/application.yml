server:
  port: ${SERVER_PORT:8086}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-fraud
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DATABASE_USERNAME:pedidos360}
    password: ${DATABASE_PASSWORD:pedidos360}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_IDLE:0}
      connection-timeout: 10000
  flyway:
    enabled: true
    create-schemas: true
    default-schema: payments
    schemas: payments
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    mode: ${APP_SECURITY_MODE:azure}
    azure:
      issuer-uri: ${AZURE_ISSUER_URI:}
      audience: ${AZURE_AUDIENCE:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
payment:
  frontend-url: ${FRONTEND_PUBLIC_URL:http://localhost}
  orders-url: ${ORDERS_INTERNAL_URL:http://localhost:8084}
  inventory-url: ${PRODUCTS_INTERNAL_URL:http://localhost:8083}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
  simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}
  antifraud-hmac-key: ${ANTIFRAUD_HMAC_KEY:}
  webpay:
    api-base: ${WEBPAY_API_BASE:https://webpay3gint.transbank.cl/rswebpaytransaction/api/webpay/v1.2}
    commerce-code: ${WEBPAY_COMMERCE_CODE:}
    api-key: ${WEBPAY_API_KEY:}
    return-url: ${WEBPAY_RETURN_URL:}
