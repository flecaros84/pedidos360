server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: orders-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DATABASE_USERNAME:pedidos360}
    password: ${DATABASE_PASSWORD:pedidos360}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DATABASE_DDL_AUTO:update}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  health:
    rabbit:
      enabled: false  # Órdenes sigue registrando pedidos si el broker está caído: outbox reintenta.
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cart:
    base-url: ${CART_INTERNAL_URL:http://localhost:8082}
  outbox:
    poll-ms: 5000
  security:
    mode: ${APP_SECURITY_MODE:local}
    azure:
      issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/placeholder/v2.0}
      audience: ${AZURE_AUDIENCE:placeholder}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
