server:
  port: ${SERVER_PORT:8084}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: orders-audit-producer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  application:
    name: orders-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DATABASE_USERNAME:pedidos360}
    password: ${DATABASE_PASSWORD:pedidos360}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_IDLE:0}
      connection-timeout: 10000
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DATABASE_DDL_AUTO:update}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  health:
    rabbit:
      enabled: false  # Órdenes sigue registrando pedidos si el broker está caído: outbox reintenta.
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cart:
    base-url: ${CART_INTERNAL_URL:http://localhost:8082}
    cleanup-ms: 5000
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  outbox:
    poll-ms: 5000
  security:
    mode: ${APP_SECURITY_MODE:azure}
    azure:
      issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/placeholder/v2.0}
      audience: ${AZURE_AUDIENCE:placeholder}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
