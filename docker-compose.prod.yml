services:
  auth-service:
    image: ghcr.io/${GHCR_OWNER}/pedidos360-auth:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8081"

  cart-service:
    image: ghcr.io/${GHCR_OWNER}/pedidos360-cart:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8082:8082"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/pedidos360-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - cart-service
